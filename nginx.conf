server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Derrière le proxy TLS de l'hôte : Location relative, pas http://...:80.
    absolute_redirect off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    location /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Noms de fichiers hashés par Vite : cache navigateur définitif.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /club/ -> /club : une seule URL par page.
    rewrite ^/(.+)/$ /$1 permanent;

    # adapter-static génère <route>.html pour chaque page prerenderée
    # ($uri.html est nécessaire pour servir /mentions-legales -> mentions-legales.html).
    # Une URL inconnue répond 404 (404.html), plus la home en 200.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
