<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/webp" href="%sveltekit.assets%/mypacer.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Umami Analytics -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="dc8bff03-6409-404e-86ff-db375f634066"
    ></script>

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MyPacer Tableau d'Allures",
        "description": "Tableau interactif des allures et des temps de passages en course à pied. Affichez et comparez vos records personnels directement depuis le tableau.",
        "url": "https://mypacer.fr/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Tous",
        "browserRequirements": "Requiert un navigateur HTML5 compatible",
        "offers": {
          "@type": "Offer",
          "price": "0.00",
          "priceCurrency": "EUR"
        }
      }
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
